#this specific project is a Rust smart contract and these are its libraries
[package]
name = "screensavvy_chain"
version = "0.1.0"
description = "ScreenSavvy rewards program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "screensavvy_chain"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]


[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["token", "associated_token"] }
